<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Dashboard | PerfumeStore</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
</head>
<body>

<!-- Inserindo a navbar -->
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">

  <h1 class="mb-4">Dashboard de Perfumes</h1>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Marca</th>
      <th>Família</th>
      <th>Volume</th>
      <th>Preço</th>
      <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="perfume : ${perfumes}">
      <td th:text="${perfume.id}"></td>
      <td th:text="${perfume.name}"></td>
      <td th:text="${perfume.brand}"></td>
      <td th:text="${perfume.fragranceFamily}"></td>
      <td th:text="${perfume.volume}"></td>
      <td th:text="${perfume.price}"></td>
      <td>
        <a th:href="@{/admin/perfumes/edit(id=${perfume.id})}" class="btn btn-secondary btn-sm" sec:authorize="hasRole('ADMIN')">
          <i class="fa-solid fa-pen-to-square"></i> Editar
        </a>

        <form th:action="@{/admin/perfumes/delete}" method="post" style="display:inline" sec:authorize="hasRole('ADMIN')">
          <input type="hidden" name="id" th:value="${perfume.id}" />
          <button type="submit" class="btn btn-danger btn-sm">
            <i class="fa-solid fa-trash"></i> Deletar
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
