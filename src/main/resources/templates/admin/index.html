<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | PerfumeStore</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
</head>
<body>

<!-- Inserindo a navbar -->
<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <h2 class="mb-4">Cadastro de Perfume</h2>

    <form action="#" th:action="@{/admin/perfumes}" th:object="${perfumeDTO}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Nome:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="mb-3">
            <label for="brand" class="form-label">Marca:</label>
            <input type="text" id="brand" th:field="*{brand}" class="form-control">
            <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
        </div>

        <div class="mb-3">
            <label for="fragranceFamily" class="form-label">Família Olfativa:</label>
            <input type="text" id="fragranceFamily" th:field="*{fragranceFamily}" class="form-control">
            <span class="error" th:if="${#fields.hasErrors('fragranceFamily')}" th:errors="*{fragranceFamily}"></span>
        </div>

        <div class="mb-3">
            <label for="volume" class="form-label">Volume:</label>
            <input type="text" id="volume" th:field="*{volume}" class="form-control">
            <span class="error" th:if="${#fields.hasErrors('volume')}" th:errors="*{volume}"></span>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Preço:</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control">
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>

</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
